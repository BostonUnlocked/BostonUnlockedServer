# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: MSBuild

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  # Path to the solution file relative to the root of the project.
  SOLUTION_FILE_PATH: server/src/Shadowrun.LocalService.sln

  # Configuration type to build.
  BUILD_CONFIGURATION: Release

  # Where dependency artifact contents are cached/restored in CI.
  DEPS_CACHE_DIR: .ci/deps

  # Target folder expected by the .csproj HintPath references.
  DEPS_DIR: server/src/Dependencies

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    environment: CI

    steps:
    - uses: actions/checkout@v4

    # Secrets are intentionally unavailable to forked PRs.
    - name: Block fork PRs for private dependency restore
      if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}
      shell: pwsh
      run: |
        Write-Error "This workflow requires private dependency access and cannot run on fork PRs."

    - name: Mint GitHub App installation token
      id: app-token
      uses: actions/create-github-app-token@v1
      with:
        app-id: ${{ secrets.GH_APP_ID }}
        private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
        owner: ${{ vars.DEPS_OWNER != '' && vars.DEPS_OWNER || github.repository_owner }}

    - name: Cache dependency bundle
      id: deps-cache
      uses: actions/cache@v4
      with:
        path: ${{ env.DEPS_CACHE_DIR }}
        key: deps-${{ runner.os }}-${{ vars.DEPS_TAG }}

    - name: Download dependency bundle from private release
      if: steps.deps-cache.outputs.cache-hit != 'true'
      shell: pwsh
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
        DEPS_REPO: ${{ vars.DEPS_REPO }}
        DEPS_TAG: ${{ vars.DEPS_TAG }}
        DEPS_ASSET: ${{ vars.DEPS_ASSET }}
        DEPS_CACHE_DIR: ${{ env.DEPS_CACHE_DIR }}
      run: |
        $ErrorActionPreference = "Stop"

        if ([string]::IsNullOrWhiteSpace($env:DEPS_REPO) -or [string]::IsNullOrWhiteSpace($env:DEPS_TAG) -or [string]::IsNullOrWhiteSpace($env:DEPS_ASSET)) {
          throw "Missing required repository variables: DEPS_REPO, DEPS_TAG, and DEPS_ASSET must be set."
        }

        New-Item -ItemType Directory -Force -Path $env:DEPS_CACHE_DIR | Out-Null

        $headers = @{
          Authorization = "Bearer $env:GH_TOKEN"
          Accept = "application/vnd.github+json"
          "X-GitHub-Api-Version" = "2022-11-28"
        }

        $releaseUrl = "https://api.github.com/repos/$env:DEPS_REPO/releases/tags/$env:DEPS_TAG"
        $release = Invoke-RestMethod -Method Get -Uri $releaseUrl -Headers $headers

        $asset = $release.assets | Where-Object { $_.name -eq $env:DEPS_ASSET } | Select-Object -First 1
        if (-not $asset) {
          throw "Release asset '$($env:DEPS_ASSET)' not found in $($env:DEPS_REPO) tag $($env:DEPS_TAG)."
        }

        $downloadHeaders = @{
          Authorization = "Bearer $env:GH_TOKEN"
          Accept = "application/octet-stream"
          "X-GitHub-Api-Version" = "2022-11-28"
        }

        $zipPath = Join-Path $env:DEPS_CACHE_DIR $env:DEPS_ASSET
        Invoke-WebRequest -Uri $asset.url -Headers $downloadHeaders -OutFile $zipPath

        $unpackDir = Join-Path $env:DEPS_CACHE_DIR "unpacked"
        if (Test-Path -LiteralPath $unpackDir) {
          Remove-Item -LiteralPath $unpackDir -Recurse -Force
        }

        Expand-Archive -Path $zipPath -DestinationPath $unpackDir -Force

    - name: Restore Dependencies directory
      shell: pwsh
      env:
        DEPS_CACHE_DIR: ${{ env.DEPS_CACHE_DIR }}
        DEPS_DIR: ${{ env.DEPS_DIR }}
      run: |
        $ErrorActionPreference = "Stop"

        $sourceDir = Join-Path $env:DEPS_CACHE_DIR "unpacked/Dependencies"
        if (-not (Test-Path -LiteralPath $sourceDir)) {
          throw "Expected unpacked Dependencies folder not found at $sourceDir"
        }

        if (Test-Path -LiteralPath $env:DEPS_DIR) {
          Remove-Item -LiteralPath $env:DEPS_DIR -Recurse -Force
        }

        Copy-Item -LiteralPath $sourceDir -Destination $env:DEPS_DIR -Recurse -Force

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v1.0.2

    - name: Build
      working-directory: ${{ github.workspace }}
      run: msbuild /m /p:Configuration=${{ env.BUILD_CONFIGURATION }} ${{ env.SOLUTION_FILE_PATH }}

    - name: Package server patch artifact
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"

        $requiredFiles = @(
          "Shadowrun.LocalService.Core.dll",
          "Shadowrun.LocalService.Core.pdb",
          "Shadowrun.LocalService.Host.exe",
          "Shadowrun.LocalService.Host.pdb"
        )

        $stageDir = Join-Path $env:GITHUB_WORKSPACE "server-patch"
        $zipPath = Join-Path $env:GITHUB_WORKSPACE "ServerPatch.zip"

        if (Test-Path -LiteralPath $stageDir) {
          Remove-Item -LiteralPath $stageDir -Recurse -Force
        }
        New-Item -ItemType Directory -Force -Path $stageDir | Out-Null

        foreach ($fileName in $requiredFiles) {
          $matches = Get-ChildItem -Path (Join-Path $env:GITHUB_WORKSPACE "server/src") -Recurse -File -Filter $fileName |
            Where-Object { $_.FullName -match "\\bin\\Release\\" }

          if (-not $matches -or $matches.Count -eq 0) {
            throw "Required build output '$fileName' was not found under bin/Release."
          }

          $selected = $matches | Sort-Object LastWriteTimeUtc -Descending | Select-Object -First 1
          Copy-Item -LiteralPath $selected.FullName -Destination (Join-Path $stageDir $fileName) -Force
        }

        if (Test-Path -LiteralPath $zipPath) {
          Remove-Item -LiteralPath $zipPath -Force
        }

        Compress-Archive -Path (Join-Path $stageDir "*") -DestinationPath $zipPath -CompressionLevel Optimal

    - name: Upload server patch artifact
      uses: actions/upload-artifact@v4
      with:
        name: server-patch
        path: ServerPatch.zip
        if-no-files-found: error

  release:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Download server patch artifact
      uses: actions/download-artifact@v4
      with:
        name: server-patch
        path: .

    - name: Compute release label
      id: release-label
      uses: actions/github-script@v7
      with:
        script: |
          const today = new Date().toISOString().slice(0, 10).replace(/-/g, "");
          const pattern = new RegExp(`^${today}\\.(\\d+)$`);

          const releaseData = await github.paginate(
            github.rest.repos.listReleases,
            {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            }
          );

          const tagData = await github.paginate(
            github.rest.repos.listTags,
            {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            }
          );

          let maxVersion = 0;

          for (const release of releaseData) {
            const match = release.tag_name.match(pattern);
            if (match) {
              maxVersion = Math.max(maxVersion, Number(match[1]));
            }
          }

          for (const tag of tagData) {
            const match = tag.name.match(pattern);
            if (match) {
              maxVersion = Math.max(maxVersion, Number(match[1]));
            }
          }

          const label = `${today}.${maxVersion + 1}`;
          core.setOutput("label", label);

    - name: Create GitHub release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.release-label.outputs.label }}
        name: ${{ steps.release-label.outputs.label }}
        files: ServerPatch.zip
        generate_release_notes: true
